# Weekly grouped updates for the two pip install surfaces, GitHub Actions,
# and the production Dockerfile base image. Majors for the app stay ungrouped
# so they get an isolated review; AgentCore pins are tightly coupled so all
# updates in that directory share one PR.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      python-app-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: pip
    directory: /agentcore_runtime
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      agentcore-runtime:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
