name: Mock CI

on:
  push:
  pull_request:

jobs:
  mock-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Ruff
        run: ruff check .

      - name: Shell syntax
        run: |
          sh -n scripts/start.sh
          sh -n scripts/build.sh
          sh -n scripts/start_prod.sh
          sh -n scripts/deploy_ecr.sh
          sh -n scripts/browser_e2e_smoke.sh

      - name: Compose config
        run: |
          # CI has no private .env; compose files require env_file: .env.
          # Use the committed example only for config validation—never commit secrets.
          cp .env.example .env
          docker compose config --quiet
          APP_IMAGE=co-design:test docker compose -f compose.prod.yaml config --quiet

      - name: Compile sources
        env:
          PYTHONPYCACHEPREFIX: /tmp/co-design-pycache
        run: python -m compileall -q backend ui streamlit_app.py tests scripts agentcore_runtime

      - name: Production configuration rejection tests
        env:
          MOCK_OPENAI: "true"
          MODEL_PROVIDER: mock
          OPENAI_API_KEY: ""
          USE_LOCAL_API: "false"
          AUTO_ADVANCE_STAGES: "false"
          APP_ENV: development
        run: python -m pytest -q tests/http/test_production_config.py tests/test_deployment_config.py

      - name: Idempotency and ownership gates
        env:
          MOCK_OPENAI: "true"
          MODEL_PROVIDER: mock
          OPENAI_API_KEY: ""
          USE_LOCAL_API: "false"
          AUTO_ADVANCE_STAGES: "false"
          APP_ENV: development
        run: >
          python -m pytest -q
          tests/persistence/test_coach_idempotency.py
          tests/http/test_multiuser_ownership.py
          tests/http/test_production_critical_path.py

      - name: Run complete mock pytest suite
        env:
          MOCK_OPENAI: "true"
          MODEL_PROVIDER: mock
          OPENAI_API_KEY: ""
          USE_LOCAL_API: "false"
          AUTO_ADVANCE_STAGES: "false"
          APP_ENV: development
        run: python -m pytest -q

      - name: Optional Docker image build
        if: github.event_name == 'push'
        run: |
          docker build -t co-design:ci-${GITHUB_SHA::12} .

  agentcore-runtime-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agentcore_runtime/requirements.txt

      - name: Install AgentCore runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r agentcore_runtime/requirements.txt

      - name: Runtime compatibility diagnostic
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/diagnostics/check_agentcore_runtime_dependencies.py

      - name: Compile AgentCore runtime
        env:
          PYTHONPYCACHEPREFIX: /tmp/co-design-pycache
        run: python -m compileall -q agentcore_runtime
