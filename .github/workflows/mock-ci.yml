name: Mock CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  mock-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up reader build
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build static notebook reader
        run: npm ci --ignore-scripts --prefix frontend && npm run build --prefix frontend

      # Ticket 46: reproducible post-build asset-size evidence (entry vs async
      # chunks). Evidence only — thresholds are judged in the ledger, not here.
      - name: Bundle size evidence
        run: npm run measure:bundle --prefix frontend

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Reviewed browser API contract and generated client
        run: |
          python scripts/export_reader_openapi.py --check
          npm run api:check --prefix frontend

      - name: Frontend unit regressions
        run: npm test --prefix frontend

      # Ticket 46: minimal deterministic ESLint (recommended rules, generated
      # client excluded). Valid findings are fixed, not suppressed; the
      # generated client is never hand-edited (ticket 33 generator quirk).
      - name: Frontend lint
        run: npm run lint --prefix frontend

      - name: Frontend dependency advisories
        run: npm audit --audit-level=high --prefix frontend

      # Ticket 46: secret scanning over the checked-out git history (bounded
      # by the default shallow checkout). Pinned image version matches the
      # locally verified run; .gitleaks.toml allowlists three documented
      # synthetic test fixtures only. Python dependency advisories run in the
      # separate scheduled dependency-audit workflow (pip-audit).
      - name: Secret scanning (gitleaks)
        run: >
          docker run --rm -v "$PWD:/repo" --workdir /repo
          ghcr.io/gitleaks/gitleaks:v8.30.1 detect --no-banner --redact

      - name: Ruff
        run: ruff check .

      - name: Shell syntax
        run: |
          sh -n scripts/start.sh
          sh -n scripts/build.sh
          sh -n scripts/start_prod.sh
          sh -n scripts/deploy_ecr.sh
          sh -n scripts/browser_e2e_smoke.sh

      - name: Compose and Caddy config
        env:
          PUBLIC_ORIGIN: https://d1sxfuoybzedj5.cloudfront.net
          APP_IMAGE: co-design:test
        run: |
          # CI has no private .env; compose files require env_file: .env.
          # Use the committed example only for config validation—never commit secrets.
          cp .env.example .env
          docker compose config --quiet
          docker compose -f compose.prod.yaml config --quiet
          docker run --rm --entrypoint caddy \
            -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2-alpine validate --config /etc/caddy/Caddyfile

      - name: Compile sources
        env:
          PYTHONPYCACHEPREFIX: /tmp/co-design-pycache
        run: python -m compileall -q backend ui streamlit_app.py tests scripts agentcore_runtime

      - name: Production configuration and CloudFront-Caddy edge contract
        env:
          MOCK_OPENAI: "true"
          MODEL_PROVIDER: mock
          OPENAI_API_KEY: ""
          USE_LOCAL_API: "false"
          AUTO_ADVANCE_STAGES: "false"
          APP_ENV: development
        run: python -m pytest -q tests/http/test_production_config.py tests/test_deployment_config.py

      - name: Idempotency and ownership gates
        env:
          MOCK_OPENAI: "true"
          MODEL_PROVIDER: mock
          OPENAI_API_KEY: ""
          USE_LOCAL_API: "false"
          AUTO_ADVANCE_STAGES: "false"
          APP_ENV: development
        run: >
          python -m pytest -q
          tests/persistence/test_coach_idempotency.py
          tests/http/test_multiuser_ownership.py
          tests/http/test_production_critical_path.py

      - name: Run complete mock pytest suite
        env:
          MOCK_OPENAI: "true"
          MODEL_PROVIDER: mock
          OPENAI_API_KEY: ""
          USE_LOCAL_API: "false"
          AUTO_ADVANCE_STAGES: "false"
          APP_ENV: development
        run: python -m pytest -q

      - name: Optional Docker image build
        if: github.event_name == 'push'
        run: |
          docker build -t co-design:ci-${GITHUB_SHA::12} .

  browser-ci-slice:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Set up reader build
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          npm ci --ignore-scripts --prefix frontend

      - name: Build static notebook reader
        run: npm run build --prefix frontend

      - name: Install Playwright Chromium
        run: frontend/node_modules/.bin/playwright install --with-deps chromium

      # Finite, self-cleaning, non-billable: deterministic mock provider, disposable
      # SQLite under the runner temp directory, loopback only, no Cognito/AWS.
      # PW_PYTHON selects the dependency-installed interpreter (no project .venv in CI).
      - name: Browser CI slice (guest journey, owner switch, restart persistence)
        env:
          PW_PYTHON: python3
        run: npm run test:browser --prefix frontend

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            output/playwright/report
            output/playwright/results.json
          if-no-files-found: ignore
          retention-days: 7

  agentcore-runtime-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agentcore_runtime/requirements.txt

      - name: Install AgentCore runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r agentcore_runtime/requirements.txt

      - name: Runtime compatibility diagnostic
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/diagnostics/check_agentcore_runtime_dependencies.py

      - name: First-cycle Strands middleware integration
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m pip install pytest
          python -m pytest -q tests/domain/test_strands_first_cycle_middleware.py tests/domain/test_first_cycle_structured_output.py
