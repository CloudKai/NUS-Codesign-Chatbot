[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = [
  "live: requires OPENAI_API_KEY and explicit RUN_LIVE_OPENAI_TESTS=true",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
# Env bootstrap must run before backend.settings is imported.
"scripts/load_probe.py" = ["E402"]
