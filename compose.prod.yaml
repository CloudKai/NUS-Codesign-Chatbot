services:
  app:
    image: ${APP_IMAGE}
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    env_file:
      - .env
    environment:
      APP_ENV: "production"
      # Month-1 pilot: coach ADVANCE auto-applies (no Next confirmation).
      # Month-2+: set AUTO_ADVANCE_STAGES=false and STUDENT_STAGE_SELECTION=true
      # so students pick stages in Journey. If both are true, selection wins.
      AUTO_ADVANCE_STAGES: "true"
      STUDENT_STAGE_SELECTION: "false"
      USE_LOCAL_API: "true"
      CO_DESIGN_PUBLIC_API_URL: "${PUBLIC_ORIGIN:?PUBLIC_ORIGIN is required}"
      CO_DESIGN_UI_URL: "${PUBLIC_ORIGIN:?PUBLIC_ORIGIN is required}"
      COGNITO_REDIRECT_URI: "${PUBLIC_ORIGIN:?PUBLIC_ORIGIN is required}/api/v1/auth/callback"
      AUTH_COOKIE_SECURE: "true"
      DSQL_SSLROOTCERT: "/etc/ssl/certs/ca-certificates.crt"
      DATABASE_PROVIDER: "dsql"
      FILE_STORAGE_PROVIDER: "s3"
      AWS_REGION: "us-west-2"
      # Runtime DSQL role (DbConnect). Never admin — schema uses scripts/init_dsql.py.
      DSQL_USER: "co_design_app"
      # Shared Lecture Notes/Readings live under COURSE_MATERIALS_BUCKET/course/.
      # Do not copy those PDFs into USER_UPLOADS_BUCKET/users/.
      COURSE_MATERIAL_SYNC_ENABLED: "true"
      COURSE_MATERIALS_PREFIX: "course/"
      # Production Knowledge Base JUQNP8AZAZ is type MANAGED. Retrieve must
      # use managedSearchConfiguration, not vectorSearchConfiguration.
      KNOWLEDGE_BASE_TYPE: "MANAGED"
      MODEL_PROVIDER: "agentcore"
      MOCK_OPENAI: "false"
      AGENTCORE_QUALIFIER: "DEFAULT"
      AGENTCORE_MODEL_PROVIDER: "bedrock"
      AGENTCORE_MODEL_ID: "global.anthropic.claude-haiku-4-5-20251001-v1:0"
      AGENTCORE_MODEL_REGION: "us-west-2"
      ROUTER_MODEL_PROVIDER: "bedrock"
      ROUTER_MODEL_ID: "global.anthropic.claude-haiku-4-5-20251001-v1:0"
      QA_MODEL_PROVIDER: "bedrock"
      QA_MODEL_ID: "global.anthropic.claude-haiku-4-5-20251001-v1:0"
      COACHING_MODEL_PROVIDER: "bedrock"
      COACHING_MODEL_ID: "global.anthropic.claude-haiku-4-5-20251001-v1:0"
      REVIEW_INCREMENTAL_MODEL_PROVIDER: "bedrock"
      REVIEW_INCREMENTAL_MODEL_ID: "global.anthropic.claude-haiku-4-5-20251001-v1:0"
      REVIEW_DEEP_MODEL_PROVIDER: "bedrock"
      REVIEW_DEEP_MODEL_ID: "global.anthropic.claude-sonnet-4-6"
      ROUTER_MIN_CONFIDENCE: "0.60"
      DEEP_REVIEW_INTERVAL_TURNS: "3"
      GUARDRAIL_VERSION: "3"
      # Process-local coach workflow capacity for ~100 concurrent students.
      # MAX_CONCURRENT_MODEL_CALLS is the historical name for active workflows,
      # not internal Haiku/Sonnet invokes inside one coaching turn.
      MAX_ACTIVE_COACH_REQUESTS_PER_NOTEBOOK: "1"
      MAX_ACTIVE_COACH_REQUESTS_PER_USER: "2"
      COACH_REQUESTS_PER_MINUTE: "8"
      MAX_CONCURRENT_MODEL_CALLS: "120"
      SYNC_THREADPOOL_TOKENS: "120"
      # Runtime-configured; do not hard-code account IDs or bucket names in Git.
      # APP_IMAGE: set on the host to the ECR image URI + immutable tag
      # DSQL_ENDPOINT: set in host .env
      # USER_UPLOADS_BUCKET: set in host .env
      # COURSE_MATERIALS_BUCKET: set in host .env (cde2300-course-content-s3)
      # AGENTCORE_RUNTIME_ARN: set in host .env
      # AGENTCORE_QUALIFIER: DEFAULT (currently liveVersion 19, repair-prompt).
      # GUARDRAIL_ID: set in host .env; also inject the same ID and version 3 on the runtime
      # KNOWLEDGE_BASE_ID: set in host .env (JUQNP8AZAZ) when course sync is on
      # Lecture notes are not bundled into the production image.
    expose:
      - "8000"
      - "8501"
    volumes:
      # Cognito client secrets only — no persistent student/application data mount.
      - type: bind
        source: ./.streamlit/secrets.toml
        target: /app/.streamlit/secrets.toml
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen("http://127.0.0.1:8000/api/v1/ready", timeout=2);
          urllib.request.urlopen("http://127.0.0.1:8501/_stcore/health", timeout=2)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    stop_grace_period: 30s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      app:
        condition: service_healthy
    ports:
      # CloudFront terminates viewer TLS. Restrict EC2 TCP 80 ingress to the
      # AWS-managed CloudFront origin-facing prefix list.
      - "80:80"
    volumes:
      - type: bind
        source: ./Caddyfile
        target: /etc/caddy/Caddyfile
        read_only: true
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
