services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      USE_LOCAL_API: "true"
      CO_DESIGN_API_URL: "http://127.0.0.1:8000"
      CO_DESIGN_PUBLIC_API_URL: "https://d1sxfuoybzedj5.cloudfront.net"
      CO_DESIGN_UI_URL: "https://d1sxfuoybzedj5.cloudfront.net"
      # Must never silently fall back to the local 127.0.0.1 Cognito callback.
      COGNITO_REDIRECT_URI: "https://d1sxfuoybzedj5.cloudfront.net/api/v1/auth/callback"
      AUTH_COOKIE_SECURE: "true"
      DATABASE_PROVIDER: "sqlite"
      FILE_STORAGE_PROVIDER: "local"
      APP_DATA_DIR: "/app/data"
      APP_DATABASE_PATH: "/app/data/co_design.sqlite3"
      APP_FILES_DIR: "/app/data/files"
      APP_WORKSPACES_DIR: "/app/data/workspaces"
      LECTURE_NOTES_DIR: "/app/lecture_notes"
      COURSE_MATERIAL_SYNC_ENABLED: "true"
      AGENTCORE_MODEL_PROVIDER: "bedrock"
      AGENTCORE_MODEL_ID: "global.anthropic.claude-haiku-4-5-20251001-v1:0"
      AGENTCORE_MODEL_REGION: "us-west-2"
      ROUTER_MODEL_PROVIDER: "bedrock"
      ROUTER_MODEL_ID: "global.anthropic.claude-haiku-4-5-20251001-v1:0"
      QA_MODEL_PROVIDER: "bedrock"
      QA_MODEL_ID: "global.anthropic.claude-haiku-4-5-20251001-v1:0"
      COACHING_MODEL_PROVIDER: "bedrock"
      COACHING_MODEL_ID: "global.anthropic.claude-haiku-4-5-20251001-v1:0"
      REVIEW_INCREMENTAL_MODEL_PROVIDER: "bedrock"
      REVIEW_INCREMENTAL_MODEL_ID: "global.anthropic.claude-haiku-4-5-20251001-v1:0"
      REVIEW_DEEP_MODEL_PROVIDER: "bedrock"
      REVIEW_DEEP_MODEL_ID: "global.anthropic.claude-sonnet-4-6"
      ROUTER_MIN_CONFIDENCE: "0.60"
      DEEP_REVIEW_INTERVAL_TURNS: "3"
      FAST_CHAT_RECENT_VERBATIM_MESSAGES: "6"
      FAST_CHAT_RECENT_HISTORY_MAX_TOKENS: "3000"
      FAST_CHAT_HISTORY_MESSAGE_MAX_TOKENS: "1500"
      FAST_CHAT_SOFT_INPUT_TOKENS: "12000"
      FAST_CHAT_MAX_INPUT_TOKENS: "16000"
      FAST_CHAT_PROMPT_CACHE_ENABLED: "false"
      AGENTCORE_QUALIFIER: "DEFAULT"
      GUARDRAIL_VERSION: "3"
    expose:
      - "8000"
      - "8501"
    volumes:
      - type: bind
        source: ./data
        target: /app/data
        bind:
          create_host_path: false
      - type: bind
        source: ./lecture_notes
        target: /app/lecture_notes
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./.streamlit/secrets.toml
        target: /app/.streamlit/secrets.toml
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen("http://127.0.0.1:8000/api/v1/ready", timeout=2);
          urllib.request.urlopen("http://127.0.0.1:8501/_stcore/health", timeout=2)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    stop_grace_period: 30s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      # CloudFront terminates viewer TLS for the configured public origin.
      - "80:80"
    volumes:
      - type: bind
        source: ./Caddyfile
        target: /etc/caddy/Caddyfile
        read_only: true
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
